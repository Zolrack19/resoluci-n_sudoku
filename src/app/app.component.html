<main class="main">
  <h3 class="my-4 text-center">Resulve el sudoku que quieras</h3>
  <p class="text-center">ingrese su sudoku aquí </p>

  <div class="mt-1 mb-3 container d-flex justify-content-center align-content-center">
    <table>
      <tbody>
        <tr class="fila" *ngFor="let item of tablero; let i = index">
          <td tabindex="0" (focus)="focus($event)" (keydown)="ingresar($event)" class="celda" *ngFor="let item of tablero; let j = index" [attr.data-row]="i" [attr.data-col]="j">
            <div>
              
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="container text-center">
    <button class="btn btn-warning btn-outline-primary  " (click)="resolver($event)">resolver!!</button>
  </div>
</main>

<router-outlet />
